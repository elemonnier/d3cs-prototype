#---------------------------------------------------------------------
##  The default configuration properties
#---------------------------------------------------------------------
###  Properties for the startup scripts
#---------------------------------------------------------------------
#  The log directory
log_dir=/dev/shm/${USER}/lepton

#  The name of the host where LEPTON is supposed to run, if several
#  hosts are used to run LEPTON and the emulated nodes
lepton_host=localhost

#  A ',' separated list of hosts where the emulated nodes run. The
#  nodes are launched on the hosts in a round-robin way.
nodes_hosts=

#  A jitter value for starting nodes (in s), used to avoid that all
#  nodes start exactly at the same time. If the jitter is defined,
#  then a node can determine its actual start time as: `start_time +
#  (1000 * rand(seed) * jitter)`. Thus, the jitter is the maximum
#  delay, in s, between the lepton and the node start times
jitter=10

#  How long we should start emulated nodes before they actually start
#  (in s)
time_margin=

#  A delay value (in s) after which nodes are started
nodes_deferred=0

#---------------------------------------------------------------------
###  Simulation
#---------------------------------------------------------------------
#  The reference virtual time (in ms), i.e. the virtual time at the
#  beginning of the simulation
ref_time=

#  True if no mobility model is used (no walk nor dgs input file) and
#  the edges are set *manually*
manual=

#  The name of the file that contains an history, composed of lines
#  in the form: `start_step end_step duration node_id`, where start
#  and end steps are in ms
in_hist=

#  Acceleration of the simulation. `accel=1` means realtime simulation,
#  `accel>1` means faster simulation, `accel<1` means slower, `accel=0`
#  means full speed (no wait between steps)
accel=1

#  The simulation area in the form
#  `car:x,y,width,height:reflat,reflon` or
#  `geo:minlat,minlon,maxlat,maxlon:reflat,reflon` (`:reflat,reflon`
#  is optional)
simul_area=car:0,0,200,200

#  The class that extends casa.lepton.OppNetRules and defines the
#  network rules (@see casa.lepton.OppNetRules)
oppnet_rules=

#  The default status of a edge if no status is supplied when it is
#  created
edge_default_status=DISCONNECTED

#  The default status of a node if no status is supplied when it is
#  created
node_default_status=NONE


#---------------------------------------------------------------------
###  Connectivity
#---------------------------------------------------------------------
#  The file that contains the connectivity types and their
#  characteristics. File format: each connectivity type is introduced
#  by its name between `[` and `]` followed by its
#  configuration. Configuration values before the first profile name
#  are common to all profiles. The connectivity configuration
#  attribute is `range`
connectivity_profiles=

#  The default connectivity type of a edge if no type is supplied
#  when it is created
default_connectivity_type=DEFAULT

#  The default radio range of nodes (in m)
range=60

#---------------------------------------------------------------------
###  Hub
#  TODO document
#---------------------------------------------------------------------
#  casa.lepton.hub.DTN_SystemAdapter
oppnet_adapter_classname=

# lepton_host=localhost

#IFDEF oppnet_adapter_classname

lepton_hub_port=4500

hub_latency=60

hub_period=10

#ENDIF oppnet_adapter_classname


#---------------------------------------------------------------------
###  Console
#---------------------------------------------------------------------
#  Console port to access the network graph. If this value is not
#  defined, no console is opened
lepton_console_port=5000


#---------------------------------------------------------------------
#---------------------------------------------------------------------
###  DGS Graph configuration
#---------------------------------------------------------------------
#  The DGS input file that defines the nodes mobility [and contacts]
in_dgs=
#conf/init.dgs

#IFDEF in_dgs

#  True if the nodes mobility is read from an input DGS (given by the
#  in_dgs property) and the edges representing the contacts must be
#  computed during the simulation
make_edges=false

#ELSE

#---------------------------------------------------------------------
#---------------------------------------------------------------------
###  Walk graph or manual configuration
#---------------------------------------------------------------------

#  The number of nodes or a ',' separated list of 'profile:nb' giving
#  the number of nodes for each profile (in that case, the profiles
#  refer to those listed in the file designed by the nodes_profiles
#  property)
nodes=10

#  Network refresh period (s), i.e. the period between the simulation
#  steps
period=1.0

#  The duration of the simulation (in s). If the value is -1, the
#  duration of the simulation is unlimited
duration=-1

#ENDIF in_dgs

#---------------------------------------------------------------------
###  DGS output
#---------------------------------------------------------------------
#  The output DGS file to log the dynamic graph produced during the
#  simulation
out_dgs=${log_dir}/lepton.dgs

#---------------------------------------------------------------------
###  Vizualisation
#---------------------------------------------------------------------
#  True if the graph should be displayed during the simulation
show=true

#  The file containing the stylesheet that defines the appearance of
#  the graph
stylesheet_file=

#  The stylesheet that defines the appearance of the graph
stylesheet="graph {fill-mode : none;} \
node {fill-mode: plain; text-alignment: above; size: 8px; fill-color: black;} \
node.TAG {stroke-mode: plain; stroke-color: green; stroke-width: 2;} \
node.OFFLINE {fill-color: #808080;} \
edge {shape: line; fill-mode: dyn-plain; size: 1px; fill-color: blue;} \
edge.CONNECTED {size: 2px; fill-color: red;} \
edge.TAG {stroke-mode: plain; stroke-color: green; stroke-width: 2;}"

#  The connectivity types and/or status for which the edges are hidden
#  (',' separated list).
hidden_edges=

#---------------------------------------------------------------------
###  Background
#---------------------------------------------------------------------
#  The DGS file that defines a graph to be displayed as background
background_graph=

#  The file of the image to be displayed as background
background_image=

#  The background area in the form "car:x,y,width,height" or
#  "geo:minlat,minlon,maxlat,maxlon:reflat,reflon"
background_area=

#  The location of the block that contains the time in the frame
#  (NORTH_WEST, NORTH_EAST, SOUTH_WEST, SOUTH_EAST)
time_corner=NORTH_WEST

#  The font of the time: fontname-style-size
time_font=Sans-BOLD-18

#  Foreground and background colors of the time: rgb integer values
time_fgcolor=0x000000
time_bgcolor=0xffffff

#---------------------------------------------------------------------
###  Video output
#---------------------------------------------------------------------
#  The directory where output images will be stored
video_img_dir=

#IFDEF video_img_dir

#  The prefix of the output images filenames
video_img_prefix=

#  If true, avoid superposition of images if the background is
#  transparent
stack_images=false

#  The resolution of the output images
resolution=

#ENDIF video_img_dir

#---------------------------------------------------------------------
#---------------------------------------------------------------------
###  Nodes configuration
#---------------------------------------------------------------------
#  The file that contains the nodes profiles and their configuration.
#  File format: each node profile is introduced by its name between
#  '[' and ']' followed by its configuration. Configuration values
#  before the first profile name are common to all profiles. The
#  configuration attributes are those of the network node
#  configuration
nodes_profiles=/home/etienne/d3cs-prototype/src/network/tools/lepton/conf/node_profiles.txt

#  The connectivity types supported by the node (',' separated
#  list). If no connectivity type is supplied, the node supports the
#  default connectivity type
supported_connectivity=

#  The file that defines associations between node ids and labels,
#  having line in the form: nodeid=label
node_labels=/home/etienne/d3cs-prototype/src/network/tools/lepton/conf/node_labels.txt

#  The label of the node
label=

#  The tag for the node
tag=

#  The connectivity type for which the node status is shown
show_node_status=DEFAULT

#  True if the node is mobile
mobile=true

#IFNDEF in_dgs

#---------------------------------------------------------------------
###  Nodes mobility (nodes of walk graph only)
#---------------------------------------------------------------------
#  The class used to define the mobility model of the node
walk_class=casa.lepton.walk.LevyWalk

#IFDEF walk_class

#  The walk area of the node in the form "car:x,y,width,height" or
#  "geo:minlat,minlon,maxlat,maxlon:reflat,reflon".
walk_area=${simul_area}

#  The initial location of the node in the form "car:x,y" or
#  "geo:lat,lon:reflat,reflon"
coord=

#  The seed to initialize the random values generator
seed=

#---------------------------------------------------------------------
###  GraphWalk & RandomWayPoint & LevyWalk
#---------------------------------------------------------------------

#  The minimum and maximum speeds of the node (in m/s)
min_speed=1
max_speed=2

#  The minimum and maximum wait durations of the node after each
#  flight (in s)
min_wait=0
max_wait=10

#---------------------------------------------------------------------
###  LevyWalk
#---------------------------------------------------------------------
#  The minimum and maximum distances of a flight (in m)
min_dist=0
max_dist=100

#  The Levy Alpha, Beta, K and Rho parameters
alpha=1.8
beta=${alpha}
k=30.55
rho=0.89

#---------------------------------------------------------------------
###  GraphWalk
#---------------------------------------------------------------------
#  String representation of the pause type (???)
pause_type=

#  The geo-referenced graph along which the node walks
graph=

#---------------------------------------------------------------------
###  BusWalk
#---------------------------------------------------------------------
#  The directory that contains the journeys file and the paths files
journeys_dir=

#  The name of the journeys file
journeys_file=

#ENDIF walk_class
#ENDIF in_dgs
