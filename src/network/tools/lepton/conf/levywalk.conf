# Native LEPTON Levy Walk scenario launched by: cargo run -- levywalk
# Movement is computed by LEPTON's casa.lepton.walk.LevyWalk implementation.

manual=false
nodes=10
mobile=true
walk_class=casa.lepton.walk.LevyWalk

# The existing labels map N00..N09 to Authority and U1..U9.
node_labels=conf/node_labels.txt
nodes_profiles=conf/levywalk_node_profiles.txt

# LEPTON recomputes contacts from the radio range as nodes move.
range=60
simul_area=car:-60,0,260,200
period=1.0
duration=-1
show=true
